<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLAN – The LAN Before Time</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  text-align: center;
  padding: 2em;
  background: #f5f5f7;
}
h1 { font-size: 2em; }
button {
  font-size: 1.3em;
  padding: 1em 1.5em;
  border-radius: 12px;
  border: none;
  background: #007aff;
  color: white;
  cursor: pointer;
  margin-top: 1em;
}
button:active { transform: scale(0.97); }
.code {
  margin: 1em 0;
  font-size: 1.1em;
  background: white;
  padding: 0.6em 1em;
  border-radius: 8px;
  display: inline-block;
}
.hint { margin-top: 1.2em; font-size: 0.9em; color: #555; }
</style>
</head>
<body>

<h1>📶 The LAN Before Time</h1>

<p>Tippe auf den Button, um dich mit dem WLAN zu verbinden.</p>

<button onclick="connectWifi()">Passwort kopieren & WLAN öffnen</button>

<p class="hint">
  iPhone: Passwort wird kopiert, WLAN-Einstellungen öffnen → Passwort einfügen.<br>
  Android: System fragt automatisch, ob du verbinden willst.
</p>

<div class="code" id="wifiInfo">WLAN: The LAN Before Time<br>Passwort: viNde7-nywbyc-caxzuv</div>

<script>
function connectWifi() {
  // Passwort kopieren
  const pw = "viNde7-nywbyc-caxzuv";
  navigator.clipboard.writeText(pw);

  // Android / iOS versuchen, WLAN-Einstellungen zu öffnen
  const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isiOS) {
    // iOS öffnet die Einstellungen-App (funktioniert nur als Hinweis)
    alert("Passwort wurde kopiert. Bitte gehe zu den WLAN-Einstellungen und füge es ein.");
  } else {
    // Android: versuchen, über Intent zu öffnen (funktioniert auf vielen Geräten)
    window.location.href = "intent://WIFI:T:WPA;S=The LAN Before Time;P=viNde7-nywbyc-caxzuv;;#Intent;scheme=wifi;end";
  }
}
</script>

</body>
</html>
