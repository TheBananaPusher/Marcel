<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLAN – The LAN Before Time</title>
<style>
html, body {
  height: 100%;
  margin: 0;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center; /* vertikal zentrieren */
  align-items: center;     /* horizontal zentrieren */
  background: #f5f5f7;
  text-align: center;
  padding: 2em;
}
h1 {
  font-size: 1.8em;
  margin-bottom: 2em;
}
button {
  font-size: 1.2em;
  padding: 1em 1.5em;
  border-radius: 10px;
  border: none;
  color: white;
  cursor: pointer;
  width: 80%;
  max-width: 300px;
  margin-bottom: 0.5em;
}
button:active {
  transform: scale(0.97);
}
#iphoneBtn { background-color: #007aff; } /* hellblau */
#androidBtn { background-color: #34c759; } /* grün */
p {
  font-size: 0.9em;
  color: #555;
  margin-top: 0.3em;
  margin-bottom: 1.5em;
}
</style>
</head>
<body>

<h1>📶 The LAN Before Time</h1>

<!-- iPhone Button -->
<button id="iphoneBtn" onclick="copyPassword()">iPhone – Passwort kopieren</button>
<p>Passwort kopiert! Jetzt WLAN öffnen & einfügen.</p>

<!-- Android Button -->
<button id="androidBtn" onclick="connectAndroid()">Android – WLAN verbinden</button>
<p>WLAN öffnet automatisch, Tippen auf Verbinden.</p>

<script>
const password = "viNde7-nywbyc-caxzuv";

// iPhone: Passwort kopieren
function copyPassword() {
  navigator.clipboard.writeText(password);
  alert("Passwort kopiert! Bitte in die WLAN-Einstellungen wechseln und einfügen.");
}

// Android: Intent-Link versuchen
function connectAndroid() {
  window.location.href = "intent://WIFI:T:WPA;S=The LAN Before Time;P=viNde7-nywbyc-caxzuv;;#Intent;scheme=wifi;end";
}
</script>

</body>
</html>
