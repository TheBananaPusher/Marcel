<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLAN – The LAN Before Time</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  text-align: center;
  padding: 2em;
  background: #f5f5f7;
}
h1 { font-size: 1.8em; margin-bottom: 1em; }
button {
  font-size: 1.2em;
  padding: 1em 1.5em;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: white;
  cursor: pointer;
  margin: 0.8em 0;
  width: 80%;
  max-width: 300px;
}
button:active { transform: scale(0.97); }
p { font-size: 0.9em; color: #555; margin-top: 0.3em; }
</style>
</head>
<body>

<h1>📶 The LAN Before Time</h1>

<!-- iPhone Button -->
<button onclick="copyPassword()">iPhone – Passwort kopieren</button>
<p>Gehe jetzt in die WLAN-Einstellungen, wähle „The LAN Before Time“ und füge das Passwort ein.</p>

<!-- Android Button -->
<button onclick="connectAndroid()">Android – WLAN verbinden</button>
<p>Das WLAN wird automatisch geöffnet, einfach auf „Verbinden“ tippen.</p>

<script>
const password = "viNde7-nywbyc-caxzuv";

// iPhone: Passwort kopieren, Nutzer muss manuell einfügen
function copyPassword() {
  navigator.clipboard.writeText(password);
  alert("Passwort wurde kopiert. Bitte in die WLAN-Einstellungen wechseln und einfügen.");
}

// Android: Intent-Link versuchen
function connectAndroid() {
  window.location.href = "intent://WIFI:T:WPA;S=The LAN Before Time;P=viNde7-nywbyc-caxzuv;;#Intent;scheme=wifi;end";
}
</script>

</body>
</html>
